name: forma

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      DATABASE_PATH: /data/kanban.db
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - board-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  board-data:
